name: AtlasCode CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Catalog tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
